{% extends "base.html" %}
{% block title %}Add Review{% endblock %}

{% block content %}
<div class="card form-card">
    <h1 style="margin-top:0;">⭐ Add Customer Review</h1>
    <p class="helptext" style="margin-bottom:20px;">
        Add a review on behalf of a customer (e.g. from a phone call or in-person feedback).
    </p>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="field">
            <label>Customer Name</label>
            <input type="text" name="customer_name" class="name-input" required>
        </div>

        <div class="field">
            <label>Rating</label>
            <div class="stars" style="display:flex; flex-direction:row-reverse; justify-content:flex-end; width:fit-content; gap:2px;">
                <input type="radio" id="star5" name="rating" value="5" required style="display:none;">
                <label for="star5" style="cursor:pointer;">★</label>
                <input type="radio" id="star4" name="rating" value="4" style="display:none;">
                <label for="star4" style="cursor:pointer;">★</label>
                <input type="radio" id="star3" name="rating" value="3" style="display:none;">
                <label for="star3" style="cursor:pointer;">★</label>
                <input type="radio" id="star2" name="rating" value="2" style="display:none;">
                <label for="star2" style="cursor:pointer;">★</label>
                <input type="radio" id="star1" name="rating" value="1" style="display:none;">
                <label for="star1" style="cursor:pointer;">★</label>
            </div>
        </div>

        <div class="field">
            <label>Customer Review</label>
            <textarea name="review_text" rows="5" placeholder="Write customer review..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Submit Review</button>
    </form>
</div>

<div style="display:flex; gap:12px; justify-content:center; margin-top:10px;">
    <a href="{% url 'review_list' %}" class="btn btn-outline btn-sm">View Reviews</a>
    <a href="{% url 'dashboard' %}" class="btn btn-outline btn-sm">Dashboard</a>
</div>

<style>
    .stars label:hover, .stars label:hover ~ label, .stars input:checked ~ label { color: gold; }
</style>
{% endblock %}
