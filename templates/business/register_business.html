{% extends "base.html" %}
{% block title %}Register Your Business{% endblock %}

{% block content %}
<div class="card form-card">
    <h1 style="margin-top:0;">Register Your Business 🏢</h1>
    <p class="helptext" style="margin-bottom:20px;">
        Tell us about your business so we can set up your admin dashboard
        and public customer review page.
    </p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Save Business</button>
    </form>
</div>
{% endblock %}
